# Local copy of the GitHub Actions test jobs: PostgreSQL and MySQL on the ports tests/engine/runtime-*.toml use,
# sharing one network namespace with the runner so 127.0.0.1 reaches them. See docs/guides/TESTING.md.
name: workflow-runtime-tests

x-shared-network: &shared-network
  network_mode: service:net

services:
  net:
    image: busybox:1.37
    command: ["sleep", "infinity"]
    init: true

  postgres:
    <<: *shared-network
    profiles: [postgresql]
    image: postgres:16
    command: ["postgres", "-p", "15432"]
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: ${WORKFLOW_TEST_DB_PASSWORD:-workflow-test}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "15432", "-U", "workflow"]
      interval: 2s
      retries: 30

  mysql:
    <<: *shared-network
    profiles: [mysql]
    image: mysql:8.4
    command: ["--port=13306", "--mysqlx=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: ${WORKFLOW_TEST_DB_PASSWORD:-workflow-test}
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 13306 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 2s
      retries: 60

  runner:
    <<: *shared-network
    build: .
    # Only the databases whose profiles the Makefile enables start; gates and SQLite-only runs need neither.
    depends_on:
      postgres: {condition: service_healthy, required: false}
      mysql: {condition: service_healthy, required: false}
    environment:
      WORKFLOW_TEST_DB_PASSWORD: ${WORKFLOW_TEST_DB_PASSWORD:-workflow-test}
    volumes:
      - ../..:/src:ro
      - ../../build/docker:/out
      # The repository's Git directory at its host path: a linked worktree's .git points there.
      - ${GIT_COMMON_DIR:-../../.git}:${GIT_COMMON_DIR:-/src/.git}:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - golangci:/root/.cache/golangci-lint
      - tools:/opt/tools
      - ballerina:/root/.ballerina

# Caches are shared by every checkout's project; Go and Ballerina caches are safe to use concurrently.
volumes:
  tools: {name: workflow-runtime-tests-tools}
  go-mod: {name: workflow-runtime-tests-go-mod}
  go-build: {name: workflow-runtime-tests-go-build}
  golangci: {name: workflow-runtime-tests-golangci}
  ballerina: {name: workflow-runtime-tests-ballerina}
