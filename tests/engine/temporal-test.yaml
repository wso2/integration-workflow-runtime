# Engine configuration for the Ballerina test suites: every service in one process, in-memory SQLite, no
# authorizer (the runner passes --allow-no-auth). Ports are 17xxx so a local run does not clash with a
# Temporal on 7233. Derived from Temporal's config/development-sqlite.yaml.
log:
  stdout: true
  level: warn

persistence:
  defaultStore: sqlite-default
  visibilityStore: sqlite-visibility
  numHistoryShards: 1
  datastores:
    sqlite-default:
      sql:
        pluginName: "sqlite"
        databaseName: "default"
        connectAddr: "localhost"
        connectProtocol: "tcp"
        connectAttributes:
          mode: "memory"
          cache: "private"
        maxConns: 1
        maxIdleConns: 1
        maxConnLifetime: "1h"
    sqlite-visibility:
      sql:
        pluginName: "sqlite"
        databaseName: "default"
        connectAddr: "localhost"
        connectProtocol: "tcp"
        connectAttributes:
          mode: "memory"
          cache: "private"
        maxConns: 1
        maxIdleConns: 1
        maxConnLifetime: "1h"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "127.0.0.1"

services:
  frontend:
    rpc:
      grpcPort: 17233
      membershipPort: 16933
      bindOnLocalHost: true
      httpPort: 17243
  matching:
    rpc:
      grpcPort: 17235
      membershipPort: 16935
      bindOnLocalHost: true
  history:
    rpc:
      grpcPort: 17234
      membershipPort: 16934
      bindOnLocalHost: true
  worker:
    rpc:
      grpcPort: 17239
      membershipPort: 16939
      bindOnLocalHost: true

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "localhost:17233"
      httpAddress: "localhost:17243"

dcRedirectionPolicy:
  policy: "noop"
