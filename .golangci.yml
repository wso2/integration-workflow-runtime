version: "2"

linters:
  default: standard
  enable:
    - depguard
    - gosec
    - misspell
    - unparam
    - usetesting
    - wastedassign
  settings:
    depguard:
      rules:
        # Our own SQL lives in internal/sqlschema; see AGENTS.md. Registering Temporal's plugins stays allowed.
        sql-boundary:
          files:
            - $all
            - "!$test"
            - "!**/internal/sqlschema/*.go"
            - "!**/cmd/workflow-engine-sql/*.go"
          deny:
            - pkg: database/sql
              desc: run SQL from internal/sqlschema
            - pkg: github.com/jmoiron/sqlx
              desc: run SQL from internal/sqlschema
            - pkg: github.com/lib/pq
              desc: run SQL from internal/sqlschema
            - pkg: github.com/jackc/pgx
              desc: run SQL from internal/sqlschema
            - pkg: github.com/go-sql-driver/mysql
              desc: run SQL from internal/sqlschema
            - pkg: modernc.org/sqlite
              desc: run SQL from internal/sqlschema
            - pkg: go.temporal.io/server/tools/sql
              desc: run SQL from internal/sqlschema
            - pkg: go.temporal.io/server/tools/common/schema
              desc: manage Temporal's schema from internal/sqlschema
            - pkg: go.temporal.io/server/common/persistence/sql$
              desc: run SQL from internal/sqlschema
            - pkg: go.temporal.io/server/common/persistence/sql/sqlplugin$
              desc: run SQL from internal/sqlschema
    usetesting:
      os-temp-dir: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      # The repository tools run the commands and open the files named on their command line; that is their job.
      - path: internal/(balsuite|covercheck)/
        linters:
          - gosec
        text: G204|G304

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wso2/integration-workflow-runtime

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
