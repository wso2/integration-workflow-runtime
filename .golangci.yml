version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - unparam
    - usetesting
    - wastedassign
  settings:
    usetesting:
      os-temp-dir: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
