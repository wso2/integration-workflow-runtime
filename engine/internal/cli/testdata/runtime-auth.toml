[runtime]
profiles = ["frontend", "history"]

[engine.tls]
certFile = "testdata/certs/engine.crt"
keyFile = "testdata/certs/engine.key"

[engine.auth]
type = "jwt"
jwksUrls = ["http://127.0.0.1:1/jwks"]
rolesClaim = "cognito:groups"

[[engine.auth.rules]]
value = "workflow-admins"
namespace = "*"
role = "admin"

[database]
type = "sqlite"
inMemory = true
