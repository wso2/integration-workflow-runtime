# The Workflow Runtime's configuration. Reference: docs/features/runtime-config.md and engine-security.md.
# Relative paths resolve against the runtime's home directory.

[runtime]
profiles = ["all"]          # or split across nodes: ["frontend"], ["history", "matching"], ["worker"]

[engine]
# Listen on every interface and tell other nodes and clients which address reaches this one.
# bindAddress = "0.0.0.0"
# broadcastAddress = "10.0.0.5"
# historyShards = 512        # fixed after the first start
logLevel = "info"
# logFile = "logs/engine.log"  # the directory must exist; standard output when not set

# TLS on port 7233 and tokens from your identity provider (docs/features/engine-security.md).
# [engine.tls]
# certFile = "conf/certs/engine.crt"
# keyFile = "conf/certs/engine.key"
#
# [engine.auth]
# type = "jwt"
# issuer = "https://idp.example.com/oauth2/token"   # its key set is discovered; or set jwksUrls
# rolesClaim = "groups"
#
# [[engine.auth.rules]]
# value = "workflow-admins"
# namespace = "*"
# role = "admin"

# [engine.metrics]
# prometheusAddress = "0.0.0.0:9464"

[database]
type = "postgresql"         # postgresql | mysql | sqlite (sqlite: trying out only)
host = "db.example.com"
port = 5432
user = "workflow"
password = "$env{WORKFLOW_DB_PASSWORD}"
name = "temporal"
visibilityName = "temporal_visibility"
# manageSchema = false      # the engine creates and upgrades the databases unless a DBA does it

# [database.tls]
# enabled = true
# caFile = "conf/certs/db-ca.pem"   # the server's certificate is verified (enableHostVerification = true)
