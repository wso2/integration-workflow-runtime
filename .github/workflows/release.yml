name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # release_dist.sh only tags main or a release-X.Y.x branch; a tag pushed by hand from elsewhere stops here.
      - name: Check the tag is on main or a release branch
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | grep -E '^origin/(main|release-[0-9]+\.[0-9]+\.x)$'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "tag $GITHUB_REF_NAME is on $branch"
              exit 0
            fi
          done
          echo "tag $GITHUB_REF_NAME is not on main or a release-X.Y.x branch" >&2
          exit 1
      - name: Get the version from the tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Any -suffix (e.g. -alpha.1, -rc.1) is a prerelease.
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # Each zip and the checksum file get a Sigstore bundle; verify with
      # cosign verify-blob --bundle <file>.sigstore.json \
      #   --certificate-identity-regexp '^https://github.com/wso2/integration-workflow-runtime/\.github/workflows/release\.yml@refs/tags/v' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>
      - name: Sign the archives and checksums
        run: |
          cd dist
          for file in *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/*.sigstore.json
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease }}
