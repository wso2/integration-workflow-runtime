name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # release_dist.sh only tags main or a release-X.Y.x branch; a tag pushed by hand from elsewhere stops here.
      - name: Check the tag is on main or a release branch
        run: |
          for branch in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | grep -E '^origin/(main|release-[0-9]+\.[0-9]+\.x)$'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "tag $GITHUB_REF_NAME is on $branch"
              exit 0
            fi
          done
          echo "tag $GITHUB_REF_NAME is not on main or a release-X.Y.x branch" >&2
          exit 1
      - name: Get the version from the tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Any -suffix (e.g. -alpha.1, -rc.1) is a prerelease.
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Each zip and the checksum file get a Sigstore bundle; verify with
      # cosign verify-blob --bundle <file>.sigstore.json \
      #   --certificate-identity-regexp '^https://github.com/wso2/integration-workflow-runtime/\.github/workflows/release\.yml@refs/tags/v' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>
      - name: Sign the archives and checksums
        run: |
          cd dist
          for file in *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/*.sigstore.json
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease }}

  image:
    name: Publish the container image
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with Sigstore
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wso2-workflow-runtime-linux-*
          path: dist
          merge-multiple: true
      - name: Unpack the linux distributions
        run: cd dist && for z in *-linux-*.zip; do unzip -q "$z"; done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        run: |
          tags="--tag $IMAGE:$VERSION"
          if [[ "${{ needs.version.outputs.is_prerelease }}" == "false" ]]; then tags="$tags --tag $IMAGE:latest"; fi
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            -f distribution/docker/Dockerfile $tags --push --metadata-file metadata.json .
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

