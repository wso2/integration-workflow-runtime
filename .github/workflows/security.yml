name: Security

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  schedule:
    # Daily, so a newly published vulnerability in a pinned dependency surfaces without a code change.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licenses:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            cli/go.sum
            engine/go.sum
      - name: Inventory is up to date
        run: make licenses && git diff --exit-code third-party/go-licenses.csv
      - name: No forbidden, restricted or unknown licenses
        run: make license-check
      - name: SBOM builds
        run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-linux-amd64
          path: build/sbom/*.cdx.json
          if-no-files-found: error

  vulnerabilities:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            tools/go.sum
      - run: make vulncheck
