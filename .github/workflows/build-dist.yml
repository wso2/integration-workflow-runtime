name: Build distribution

on:
  workflow_call:
    inputs:
      version:
        description: 'Version embedded with -X main.version and used in artifact names'
        required: true
        type: string
      ref:
        description: 'Git ref or SHA to build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Build the distribution
        run: make dist GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} VERSION=${{ inputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: wso2-workflow-runtime-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
