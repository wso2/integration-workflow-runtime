name: Build and test

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            cli/go.sum
            engine/go.sum
            tools/go.sum
      - name: Build
        run: make build && ./build/workflow-engine version && ./build/workflow-cli version
      - name: Vet
        run: make vet
      - name: Check gofmt
        run: make fmt-check
      - name: Unit tests with the 75% coverage gate
        run: make test-coverage
      - name: Unit tests with the race detector
        run: make test-race
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage/*.out
          if-no-files-found: error

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            cli/go.sum
            engine/go.sum
      - run: make build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

  # The launcher starts the engine as a child process on Windows (exec elsewhere); run its process tests there.
  windows-tests:
    name: Launcher tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Launcher tests
        working-directory: engine
        run: go test -count=1 -v ./internal/launcher/...
