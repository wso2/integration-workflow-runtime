name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Test the repository scripts
        run: make test-scripts
      - name: Build
        run: make build && ./build/workflow-engine version
      - name: Vet
        run: make vet
      - name: Check gofmt
        run: make fmt-check
      - name: Unit tests with the 75% coverage gate
        run: make test-coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/*.out
          if-no-files-found: error

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - run: make engine GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
