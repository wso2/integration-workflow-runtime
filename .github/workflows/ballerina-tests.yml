name: Ballerina tests

# Runs Ballerina programs on jBallerina (ballerina/workflow) against the engine binary built from this commit, started
# from tests/engine/runtime-<database>.toml. Smoke on every pull request on SQLite, PostgreSQL and MySQL; smoke and full
# on all three on main, nightly and on demand.

on:
  pull_request:
  push:
    branches: [main, 'release-*']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        default: full
        type: choice
        options: [smoke, full]
      database:
        description: 'Database'
        required: true
        default: sqlite
        type: choice
        options: [sqlite, postgresql, mysql, dev]

permissions:
  contents: read

concurrency:
  group: ballerina-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPORAL_CLI_VERSION: '1.9.1'
  # Throwaway credentials for the service containers below; not a secret.
  WORKFLOW_TEST_DB_PASSWORD: workflow-test

jobs:
  suite:
    name: ${{ matrix.suite }} suite on ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: >-
          ${{ fromJSON(
            github.event_name == 'pull_request' && '["smoke"]' ||
            github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.suite) ||
            '["smoke", "full"]') }}
        database: >-
          ${{ fromJSON(
            github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.database) ||
            '["sqlite", "postgresql", "mysql", "dev"]') }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow-test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U workflow" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: workflow-test
        ports: ['13306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pworkflow-test" --health-interval 5s --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            cli/go.sum
            engine/go.sum
            tools/go.sum
      - name: Build the engine and workflow-cli
        run: make build && ./build/workflow-engine version && ./build/workflow-cli version
      # Both service databases run in every job; one job covers the schema test for both.
      - name: Test schema preparation on PostgreSQL and MySQL
        if: matrix.database == 'postgresql' && matrix.suite == 'smoke'
        working-directory: engine
        run: go test -count=1 -run 'OnRealDatabases|LimitedToItsDatabases' -v ./internal/sqlschema
      - name: Set up Ballerina (latest)
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: latest
      - name: Install the Temporal CLI (test harness only)
        run: |
          base="https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}"
          archive="temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" temporal
          sudo mv temporal /usr/local/bin/temporal
          temporal --version
      # Real-engine tests driven by the Temporal CLI and workflow-cli; one job is enough.
      - name: Engine tests (restart persistence, security, workflow-cli)
        if: matrix.database == 'sqlite' && matrix.suite == 'smoke'
        working-directory: tools
        env:
          WORKFLOW_ENGINE: ${{ github.workspace }}/build/workflow-engine
          WORKFLOW_CLI: ${{ github.workspace }}/build/workflow-cli
        run: go test -count=1 -v ./internal/enginetest
      - name: Run the ${{ matrix.suite }} suite on ${{ matrix.database }}
        env:
          ENGINE_LOG_DIR: build/logs
        run: >-
          go run ./tools/cmd/balsuite ${{ matrix.suite }} --database ${{ matrix.database }}
          --engine build/workflow-engine
      # A workflow started on the previous Temporal release, with its older schema, finishes on this engine.
      - name: Upgrade from Temporal 1.30.9 on ${{ matrix.database }}
        if: matrix.suite == 'smoke' && (matrix.database == 'postgresql' || matrix.database == 'mysql')
        env:
          ENGINE_LOG_DIR: build/logs
        run: >-
          go run ./tools/cmd/balsuite upgrade --database ${{ matrix.database }}
          --engine build/workflow-engine --old-temporal 1.30.9
      - name: Upload engine and test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-${{ matrix.database }}-logs
          path: |
            build/logs/
            tests/ballerina/${{ matrix.suite }}/target/report/
            tests/ballerina/upgrade/target/report/
          if-no-files-found: ignore
