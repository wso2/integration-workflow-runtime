name: Lint PR

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

# pull_request_target runs with the base branch context; keep permissions minimal and never check out the PR head.
permissions: {}

concurrency:
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            build
            chore
            ci
            docs
            style
            refactor
            perf
            test
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must start with a lowercase letter, got: "{subject}".
            Example: "feat(engine): add the engine endpoint on port 7233"

  validate-commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The base branch, so the PR under review cannot alter the check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate non-merge commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          commits=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | select((.parents | length) <= 1) | [.sha[0:7], (.commit.message | split("\n")[0] | rtrimstr("\r") | @base64)] | @tsv')
          failed=0
          while IFS=$'\t' read -r sha encoded_subject; do
            [[ -n "$sha" ]] || continue
            subject=$(printf '%s' "$encoded_subject" | base64 --decode)
            if ! .github/scripts/check_commit_subject.sh "$subject"; then
              printf 'Commit: %s\n\n' "$sha" >&2
              failed=1
            fi
          done <<< "$commits"
          exit "$failed"
